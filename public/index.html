<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descuentos Getones | Ofertas Steam Chile</title>
  
  <!-- Fuentes Google: Orbitron & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#050508',
              card: '#0a0a12',
              cyan: '#00f0ff',
              pink: '#ff007f',
              yellow: '#ffee00',
              gray: '#121222'
            }
          },
          fontFamily: {
            cyber: ['Orbitron', 'sans-serif'],
            body: ['Rajdhani', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
      .text-glow-cyan { text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff; }
      .text-glow-pink { text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f; }
      .text-glow-yellow { text-shadow: 0 0 10px #ffee00, 0 0 20px #ffee00; }
      .glow-cyan { box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
      .glow-pink { box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
      .glow-yellow { box-shadow: 0 0 15px rgba(255, 238, 0, 0.4); }
    }

    /* Scrollbar estilizada estilo cyberpunk */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050508; }
    ::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #ff007f; }
  </style>
</head>

<body class="bg-[#050508] text-slate-200 font-body min-h-screen flex flex-col selection:bg-[#ff007f] selection:text-white">

  <!-- Header Responsive -->
  <header class="border-b-2 border-[#00f0ff]/40 bg-[#0a0a12]/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 md:py-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center space-x-3 text-center sm:text-left">
        <div class="w-8 h-8 md:w-10 md:h-10 bg-[#ff007f] flex items-center justify-center font-cyber font-black text-black text-lg md:text-xl transform -skew-x-12 shadow-[0_0_15px_#ff007f]">
          %
        </div>
        <div>
          <h1 class="font-cyber font-black text-lg sm:text-2xl md:text-3xl tracking-wider text-white">
            DESCUENTOS <span class="text-[#00f0ff] text-glow-cyan">GETONES</span>
          </h1>
          <p class="text-[10px] md:text-xs text-slate-400 font-cyber tracking-widest uppercase">Steam Chile Deals Tracker</p>
        </div>
      </div>

      <!-- Buscador para pantallas grandes y móviles -->
      <div class="w-full sm:w-72 relative">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="BUSCAR JUEGO..." 
          class="w-full bg-[#121222] border-2 border-[#00f0ff]/50 text-white placeholder-slate-500 text-xs md:text-sm font-cyber px-4 py-2 focus:outline-none focus:border-[#ff007f] focus:glow-pink transition-all uppercase"
        >
        <span class="absolute right-3 top-2.5 text-[#00f0ff] text-xs">🔍</span>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- Solapas / Filtros de Descuento (Scroll Horizontal en Móviles) -->
    <div class="flex items-center justify-start sm:justify-center overflow-x-auto gap-2 pb-2 scrollbar-none">
      <button data-discount="70" class="tab-btn active whitespace-nowrap bg-[#ffee00] text-black font-cyber font-bold px-4 py-2 text-xs md:text-sm tracking-wider border-2 border-white glow-yellow transition-all uppercase">
        🔥 70%+ OFF
      </button>
      <button data-discount="80" class="tab-btn whitespace-nowrap bg-[#0d0d18] text-[#00f0ff] hover:bg-[#00f0ff] hover:text-black font-cyber font-bold px-4 py-2 text-xs md:text-sm tracking-wider border-2 border-[#00f0ff]/50 hover:glow-cyan transition-all uppercase">
        ⚡ 80%+ OFF
      </button>
      <button data-discount="90" class="tab-btn whitespace-nowrap bg-[#0d0d18] text-[#00f0ff] hover:bg-[#00f0ff] hover:text-black font-cyber font-bold px-4 py-2 text-xs md:text-sm tracking-wider border-2 border-[#00f0ff]/50 hover:glow-cyan transition-all uppercase">
        💥 90%+ OFF
      </button>
      <button data-discount="100" class="tab-btn whitespace-nowrap bg-[#0d0d18] text-[#ff007f] hover:bg-[#ff007f] hover:text-black font-cyber font-bold px-4 py-2 text-xs md:text-sm tracking-wider border-2 border-[#ff007f]/50 hover:glow-pink transition-all uppercase">
        🎁 100% GRATIS
      </button>
    </div>

    <!-- Subcategorías (Chips con Scroll Horizontal en Móviles) -->
    <div id="subcategoriesList" class="flex items-center gap-1.5 overflow-x-auto pb-2 text-xs scrollbar-none">
      <!-- Carga Dinámica desde JS -->
    </div>

    <!-- Feedback de Carga / Spinner Neón -->
    <div id="loading" class="flex flex-col items-center justify-center py-16 space-y-4">
      <div class="w-12 h-12 border-4 border-[#00f0ff] border-t-[#ff007f] rounded-full animate-spin shadow-[0_0_15px_#00f0ff]"></div>
      <p class="font-cyber text-xs tracking-widest text-[#00f0ff] uppercase animate-pulse">Cargando Ofertas Steam Chile...</p>
    </div>

    <!-- Sin Resultados -->
    <div id="emptyState" class="hidden text-center py-16 space-y-3 bg-[#0a0a12] border-2 border-slate-800 p-6">
      <div class="text-4xl">👾</div>
      <h3 class="font-cyber text-lg text-white">No se encontraron juegos</h3>
      <p class="text-xs text-slate-400">Intenta cambiar los filtros de descuento o el término de búsqueda.</p>
    </div>

    <!-- Grid de Juegos (Optimizado: 1 Columna en Teléfonos, 2 en Tablet, 3-4 en Desktop) -->
    <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
      <!-- Tarjetas de Juegos Renderizadas por app.js -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-[#00f0ff]/20 bg-[#0a0a12] mt-12 py-6 text-center text-xs text-slate-500 font-cyber">
    <p>DESCUENTOS GETONES &copy; 2026 | Precios Oficiales Steam Chile (CLP)</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
